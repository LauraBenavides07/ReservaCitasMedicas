packages:
  - 'backend'
  - 'frontend'
  - 'notification-service'

allowBuilds:
  '@nestjs/core': true
  bcrypt: true
  unrs-resolver: true
  '@parcel/watcher': true
  esbuild: true
  lmdb: true
  msgpackr-extract: true

minimumReleaseAgeExclude:
  - '@nestjs/common@11.1.23'
  - '@nestjs/core@11.1.23'
  - '@nestjs/microservices@11.1.23'
  - '@nestjs/platform-express@11.1.23'
  - '@nestjs/testing@11.1.23'
  - ts-jest@29.4.11
  - '@analogjs/vite-plugin-angular@2.5.2'
  - '@analogjs/vitest-angular@2.5.2'