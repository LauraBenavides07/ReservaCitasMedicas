<!-- Contenedor condicional para vistas sin autenticación (landing, login, register) -->
<ng-container *ngIf="view() === 'landing' || view() === 'login' || view() === 'register'">
  <!-- Componente de página de aterrizaje que emite eventos de navegación -->
  <app-landing-page (navigate)="view.set($event)"></app-landing-page>
</ng-container>

<!-- MODALES DE AUTENTICACIÓN -->
<!-- Modal de inicio de sesión -->
<ng-container *ngIf="view() === 'login'">
  <app-login (navigate)="view.set($event)"></app-login>
</ng-container>

<!-- Modal de registro de usuario -->
<ng-container *ngIf="view() === 'register'">
  <app-register (navigate)="view.set($event)"></app-register>
</ng-container>

<!-- DASHBOARD: se muestra cuando el usuario está autenticado y no está en vistas de autenticación -->
<ng-container *ngIf="view() !== 'landing' && view() !== 'login' && view() !== 'register'">
  <div class="dashboard-layout">

    <!-- BARRA LATERAL (SIDEBAR) -->
    <aside class="sidebar">
      <!-- Logo y nombre del centro médico -->
      <div class="sidebar-brand">
        <img src="img/logo.png" alt="Piedrazul Logo" class="logo-img">
        <div class="logo-text">
          <span class="brand-name">Piedrazul</span>
          <span class="brand-sub">CENTRO MÉDICO</span>
        </div>
      </div>

      <!-- Título de la sección de navegación -->
      <div class="sidebar-section">MENÚ</div>

      <!-- Navegación principal -->
      <nav class="sidebar-nav">

        <!-- VISTAS PARA ADMINISTRADORES Y STAFF (no pacientes) -->
        <ng-container *ngIf="auth.isLoggedIn() && auth.user()?.role !== 'patient'">
          <!-- Botón para buscar citas -->
          <button class="nav-item" (click)="view.set('admin-list')" [class.active]="view() === 'admin-list'">
            <span class="icon">
              <!-- Icono de lupa (buscar) -->
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
              </svg>
            </span>
            Buscar Citas
          </button>

          <!-- Botón para crear nueva cita -->
          <button class="nav-item" (click)="view.set('admin-create')" [class.active]="view() === 'admin-create'">
            <span class="icon">
              <!-- Icono de más (+) -->
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
              </svg>
            </span>
            Nueva Cita
          </button>

          <!-- Botón de configuración (solo visible para administradores) -->
          <button *ngIf="auth.user()?.role === 'admin'" class="nav-item" (click)="view.set('admin-config')"
            [class.active]="view() === 'admin-config'">
            <span class="icon">
              <!-- Icono de engranaje (configuración) -->
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="3"></circle>
                <path
                  d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z">
                </path>
              </svg>
            </span>
            Configuración
          </button>
        </ng-container>

        <!-- VISTAS PARA PACIENTES -->
        <ng-container *ngIf="auth.isLoggedIn() && auth.user()?.role === 'patient'">
          <!-- Botón para ver mis citas -->
          <button class="nav-item" (click)="view.set('patient-dashboard')"
            [class.active]="view() === 'patient-dashboard'">
            <span class="icon">
              <!-- Icono de calendario -->
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                <line x1="16" y1="2" x2="16" y2="6"></line>
                <line x1="8" y1="2" x2="8" y2="6"></line>
                <line x1="3" y1="10" x2="21" y2="10"></line>
              </svg>
            </span>
            Mis Citas
          </button>

          <!-- Botón para crear nueva cita -->
          <button class="nav-item" (click)="view.set('patient-create')" [class.active]="view() === 'patient-create'">
            <span class="icon">
              <!-- Icono de más (+) -->
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
              </svg>
            </span>
            Nueva Cita
          </button>
        </ng-container>
      </nav>

      <!-- Espaciador flexible para empujar el perfil al fondo -->
      <div class="sidebar-spacer"></div>

      <!-- PERFIL DE USUARIO Y CIERRE DE SESIÓN -->
      <div class="sidebar-user" *ngIf="auth.isLoggedIn()">
        <!-- Avatar con inicial del nombre -->
        <div class="user-avatar">{{ auth.user()?.firstName?.[0] || 'U' }}</div>
        <div class="user-details">
          <span class="user-name">{{ auth.user()?.firstName }} {{ auth.user()?.lastName }}</span>
          <span class="user-role">{{ auth.user()?.role === 'admin' ? 'Administrador' : (auth.user()?.role === 'patient'
            ? 'Paciente' : 'Agendador') }}</span>
        </div>
        <!-- Botón para cerrar sesión -->
        <button class="btn-logout-icon" (click)="logout()" title="Cerrar sesión">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
        </button>
      </div>
    </aside>

    <!-- CONTENIDO PRINCIPAL DEL DASHBOARD -->
    <main class="dashboard-main">
      <!-- Encabezado con el título de la vista actual -->
      <header class="dashboard-header">
        <h2 class="view-title">
          <ng-container *ngIf="view() === 'admin-list'">Buscar Citas</ng-container>
          <ng-container *ngIf="view() === 'admin-create' || view() === 'patient-create'">Nueva Cita</ng-container>
          <ng-container *ngIf="view() === 'admin-config'">Configuración</ng-container>
          <ng-container *ngIf="view() === 'patient-dashboard'">Mis Citas</ng-container>
        </h2>
      </header>

      <!-- Área de contenido dinámico según la vista -->
      <div class="dashboard-content">
        <!-- VISTAS DE ADMINISTRADOR -->
        <div *ngIf="view() === 'admin-list'">
          <app-appointment-list></app-appointment-list>
        </div>
        <div *ngIf="view() === 'admin-create'">
          <app-appointment-form></app-appointment-form>
        </div>

        <!-- VISTA DE CONFIGURACIÓN DE ADMINISTRADOR -->
        <div *ngIf="view() === 'admin-config'">
          <app-admin-config></app-admin-config>
        </div>

        <!-- VISTAS DE PACIENTE -->
        <div *ngIf="view() === 'patient-dashboard'">
          <app-patient-dashboard (navigate)="view.set($event)"></app-patient-dashboard>
        </div>
        <div *ngIf="view() === 'patient-create'">
          <app-patient-appointment-form (navigate)="view.set($event)"></app-patient-appointment-form>
        </div>
      </div>
    </main>
  </div>
</ng-container>
