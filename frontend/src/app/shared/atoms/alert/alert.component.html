<div
  *ngIf="isVisible"
  [ngClass]="alertClasses"
  role="alert"
  aria-live="polite">

  <!-- Icono del tipo -->
  <span class="alert__icon" aria-hidden="true">
    <i [class]="getIconClass()" aria-hidden="true"></i>
  </span>

  <!-- Mensaje (soporta HTML con innerHTML para el caso info con <strong>) -->
  <span class="alert__message" [innerHTML]="message"></span>

  <!-- Botón de cerrar (solo si dismissible=true) -->
  <button
    *ngIf="dismissible"
    class="alert__close"
    (click)="dismiss()"
    aria-label="Cerrar alerta"
    type="button">
    <i class="ti ti-x" aria-hidden="true"></i>
  </button>

</div>
