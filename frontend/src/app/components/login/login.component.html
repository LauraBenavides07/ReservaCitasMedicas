<div class="auth-overlay">
  <div class="auth-card">
    <app-button variant="secondary" size="sm" (clicked)="navigate.emit('landing')" ariaLabel="Cerrar">×</app-button>
    <div class="auth-header">
      <div class="header-content">
        <img src="img/logo.png" alt="Piedrazul Logo" class="logo-img" width="70" height="70" loading="lazy">
        <h1 class="auth-title">Bienvenido a Piedrazul</h1>
        <p class="auth-subtitle">Centro Médico Especializado</p>
      </div>
      <!-- Background decorators -->
      <div class="header-decorator circle-1"></div>
      <div class="header-decorator circle-2"></div>
    </div>

    <div class="auth-tabs">
      <button class="tab-btn active" (click)="$event.preventDefault()">Iniciar sesión</button>
      <button class="tab-btn" (click)="navigate.emit('register')">Crear cuenta</button>
    </div>

    <div class="auth-body">
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <app-form-field
          label="CÉDULA O CORREO ELECTRÓNICO"
          inputId="login-input"
          [required]="true"
          [error]="f['login'].invalid && f['login'].touched ? 'Por favor digite su cédula o correo.' : ''">
          <input type="text" id="login-input" formControlName="login"
            placeholder="123456789 o correo@ejemplo.com"
            [class.input-error]="f['login'].invalid && f['login'].touched">
        </app-form-field>

        <app-form-field
          label="CONTRASEÑA"
          inputId="password-input"
          [required]="true"
          [error]="f['password'].invalid && f['password'].touched ? 'Por favor digite su contraseña.' : ''">
          <input [type]="showPassword() ? 'text' : 'password'" id="password-input"
            formControlName="password" placeholder="••••••••"
            [class.input-error]="f['password'].invalid && f['password'].touched">
          <div class="checkbox-container">
            <input type="checkbox" id="show-password-login" [checked]="showPassword()"
              (change)="togglePasswordVisibility()">
              <label for="show-password-login">Mostrar contraseña</label>
          </div>
        </app-form-field>
        <app-alert
          type="error"
          [message]="error()"
          [show]="!!error()">
        </app-alert>

        <app-button
        type="button"
        variant="primary"
        [fullWidth]="true"
        [loading]="isLoading()"
        [disabled]="isLoading()"
        (clicked)="onSubmit()">
        {{ isLoading() ? 'Ingresando...' : 'Ingresar' }}
      </app-button>
      </form>

    </div>
  </div>
</div>
