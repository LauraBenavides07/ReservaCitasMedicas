<div class="auth-overlay">
  <div class="auth-card">
    <app-button variant="secondary" size="sm" (clicked)="navigate.emit('landing')" ariaLabel="Cerrar">×</app-button>
    <div class="auth-header">
      <div class="header-content">
        <img src="img/logo.png" alt="Piedrazul Logo" class="logo-img" width="70" height="70" loading="lazy">
        <h1 class="auth-title">Bienvenido a Piedrazul</h1>
        <p class="auth-subtitle">Centro Médico Especializado</p>
      </div>
      <!-- Background decorators -->
      <div class="header-decorator circle-1"></div>
      <div class="header-decorator circle-2"></div>
    </div>

    <div class="auth-tabs">
      <button class="tab-btn active" (click)="$event.preventDefault()">Iniciar sesión</button>
      <button class="tab-btn" (click)="navigate.emit('register')">Crear cuenta</button>
    </div>

    <div class="auth-body">
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <div class="form-field">
          <label for="login-input">CÉDULA O CORREO ELECTRÓNICO *</label>
          <input type="text" id="login-input" formControlName="login" placeholder="123456789 o correo@ejemplo.com"
            [class.input-error]="f['login'].invalid && f['login'].touched">
          <div *ngIf="f['login'].invalid && f['login'].touched" class="error-message">
            Por favor digite su cédula o correo.
          </div>
        </div>

        <div class="form-field">
          <label for="password-input">CONTRASEÑA *</label>
          <div class="password-field-wrapper">
            <input [type]="showPassword() ? 'text' : 'password'" id="password-input" formControlName="password" placeholder="••••••••"
              [class.input-error]="f['password'].invalid && f['password'].touched">
          </div>
          <div class="checkbox-container">
            <input type="checkbox" id="show-password-login" [checked]="showPassword()"
              (change)="togglePasswordVisibility()">
            <label for="show-password-login">Mostrar contraseña</label>
          </div>
          <div *ngIf="f['password'].invalid && f['password'].touched" class="error-message">
            Por favor digite su contraseña.
          </div>
        </div>

        <div *ngIf="error()" class="alert alert-error">
          {{ error() }}
        </div>

        <app-button
        type="submit"
        variant="primary"
        [fullWidth]="true"
        [loading]="isLoading()"
        [disabled]="isLoading()">
        {{ isLoading() ? 'Ingresando...' : 'Ingresar' }}
      </app-button>
      </form>

    </div>
  </div>
</div>
