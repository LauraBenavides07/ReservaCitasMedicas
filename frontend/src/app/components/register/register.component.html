<!-- Modal de registro de usuario -->
<div class="auth-overlay">
    <div class="auth-card">
        <!-- Botón para cerrar el modal -->
        <app-button variant="secondary" size="sm" (clicked)="navigate.emit('landing')" ariaLabel="Cerrar">×</app-button>

        <!-- Encabezado del modal con logo y título -->
        <div class="auth-header">
            <div class="header-content">
                <img src="img/logo.png" alt="Piedrazul Logo" class="logo-img" width="55" height="55" loading="lazy">
                <h1 class="auth-title">Bienvenido a Piedrazul</h1>
                <p class="auth-subtitle">Centro Médico Especializado</p>
            </div>
            <div class="header-decorator circle-1"></div>
            <div class="header-decorator circle-2"></div>
        </div>

        <!-- Pestañas de navegación entre login y registro -->
        <div class="auth-tabs">
            <button class="tab-btn" (click)="navigate.emit('login')">Iniciar sesión</button>
            <button class="tab-btn active" (click)="$event.preventDefault()">Crear cuenta</button>
        </div>

        <!-- Cuerpo del modal con el formulario de registro -->
        <div class="auth-body">
            <form [formGroup]="registerForm">

                <!-- Fila de nombres y apellidos -->
                <div class="form-row">
                    <app-form-field
                        label="NOMBRES"
                        inputId="reg-firstName"
                        [required]="true"
                        [error]="f['firstName'].invalid && f['firstName'].touched ?
                            (f['firstName'].errors?.['minlength'] ? 'debe tener al menos 3 caracteres' :
                             f['firstName'].errors?.['maxlength'] ? 'debe tener maximo 20 caracteres' :
                             f['firstName'].errors?.['pattern'] ? 'El nombre no puede contener números ni caracteres especiales' :
                             'Por favor escriba sus nombres.') : ''">
                        <input type="text" id="reg-firstName" formControlName="firstName" placeholder="Juan"
                            [class.input-error]="f['firstName'].invalid && f['firstName'].touched">
                    </app-form-field>
                    <app-form-field
                        label="APELLIDOS"
                        inputId="reg-lastName"
                        [required]="true"
                        [error]="f['lastName'].invalid && f['lastName'].touched ?
                            (f['lastName'].errors?.['minlength'] ? 'debe tener al menos 3 caracteres' :
                             f['lastName'].errors?.['maxlength'] ? 'debe tener maximo 20 caracteres' :
                             f['lastName'].errors?.['pattern'] ? 'El apellido no puede contener números ni caracteres especiales' :
                             'Por favor escriba sus apellidos.') : ''">
                        <input type="text" id="reg-lastName" formControlName="lastName" placeholder="Perez"
                            [class.input-error]="f['lastName'].invalid && f['lastName'].touched">
                    </app-form-field>
                </div>

                <!-- Fila de documento y teléfono -->
                <div class="form-row">

                    <!-- CAMPO CÉDULA — con validadores personalizados -->
                    <div class="form-field-wrapper">
                        <label for="reg-document" class="form-label">
                            CÉDULA <span class="required-mark">*</span>
                        </label>
                        <input
                            type="text"
                            id="reg-document"
                            formControlName="document"
                            placeholder="Ej: 1061234567"
                            [class.input-error]="f['document'].invalid && f['document'].touched">

                        <!-- Indicador mientras se valida de forma asíncrona -->
                        <small *ngIf="f['document'].pending" class="text-validating">
                            Verificando disponibilidad...
                        </small>

                        <!-- Bloque de errores: se muestra si el campo es inválido y fue tocado -->
                        <div *ngIf="f['document'].invalid && f['document'].touched && !f['document'].pending"
                             class="text-danger">

                            <!-- Error 1: campo vacío -->
                            <small *ngIf="f['document'].errors?.['required']">
                                La cédula es obligatoria.
                            </small>

                            <!-- Error 2: validador síncrono personalizado -->
                            <small *ngIf="f['document'].errors?.['documentoInvalido']">
                                La cédula debe tener entre 6 y 10 dígitos numéricos.
                            </small>

                            <!-- Error 3: validador asíncrono personalizado (backend) -->
                            <small *ngIf="f['document'].errors?.['documentoDuplicado']">
                                Este número de cédula ya está registrado.
                            </small>
                        </div>
                    </div>

                    <app-form-field
                        label="TELÉFONO"
                        inputId="reg-phone"
                        [required]="true"
                        [error]="f['phone'].invalid && f['phone'].touched ?
                            (f['phone'].errors?.['required'] ? 'El teléfono es obligatorio.' :
                             f['phone'].errors?.['pattern'] ? 'El teléfono debe contener 10 números.' : '') : ''">
                        <input type="tel" id="reg-phone" formControlName="phone" placeholder="Número de celular"
                            [class.input-error]="f['phone'].invalid && f['phone'].touched">
                    </app-form-field>
                </div>

                <!-- Fila de correo y género -->
                <div class="form-row">
                    <app-form-field
                        label="CORREO ELECTRÓNICO"
                        inputId="reg-email"
                        [required]="true"
                        [validating]="f['email'].pending"
                        [error]="f['email'].invalid && f['email'].touched && !f['email'].pending ?
                            (f['email'].errors?.['required'] ? 'El email es obligatorio.' :
                            f['email'].errors?.['email'] ? 'El correo no tiene un formato válido.' :
                            f['email'].errors?.['invalidEmailFormat'] ? 'El correo no sigue un formato válido.' :
                            f['email'].errors?.['invalidEmailDomain'] ? 'El correo debe terminar en @gmail.com, @hotmail.com o @unicauca.edu.co.' :
                            f['email'].errors?.['emailDuplicado'] ? 'Este correo electrónico ya está registrado.' :
                            'Por favor ingrese un correo válido.') : ''">
                        <input type="email" id="reg-email" formControlName="email"
                            placeholder="correo@ejemplo.com"
                            [class.input-error]="f['email'].invalid && f['email'].touched">
                    </app-form-field>
                    <app-form-field
                        label="GÉNERO"
                        inputId="reg-gender"
                        [required]="true"
                        [error]="f['gender'].invalid && f['gender'].touched ? 'Por favor seleccione su género.' : ''">
                        <select id="reg-gender" formControlName="gender"
                            [class.input-error]="f['gender'].invalid && f['gender'].touched">
                            <option value="">Seleccione</option>
                            <option value="M">Masculino</option>
                            <option value="F">Femenino</option>
                            <option value="O">Otro</option>
                        </select>
                    </app-form-field>
                </div>

                <!-- Campo de contraseña -->
                <app-form-field
                    label="CONTRASEÑA"
                    inputId="reg-password"
                    [required]="true"
                    [error]="f['password'].invalid && f['password'].touched ?
                        (f['password'].errors?.['required'] ? 'La contraseña es obligatoria.' :
                         f['password'].errors?.['minlength'] ? 'La contraseña debe tener al menos 8 caracteres.' : '') : ''">
                    <div class="password-field-wrapper">
                        <input [type]="showPassword() ? 'text' : 'password'" id="reg-password" formControlName="password"
                            placeholder="Mínimo 8 caracteres"
                            [class.input-error]="f['password'].invalid && f['password'].touched">
                    </div>
                    <div class="checkbox-container">
                        <input type="checkbox" id="show-password-reg" [checked]="showPassword()"
                            (change)="togglePassword()">
                        <label for="show-password-reg">Mostrar contraseña</label>
                    </div>
                </app-form-field>

                <!-- Mensaje de error general -->
                <app-alert type="error" [message]="error()" [show]="!!error()"></app-alert>

                <!-- Mensaje de éxito -->
                <app-alert type="success" [message]="successMessage()" [show]="!!successMessage()"></app-alert>

                <!-- BOTÓN CREAR: deshabilitado si el formulario es inválido O está cargando -->
                <app-button
                    type="submit"
                    variant="primary"
                    [fullWidth]="true"
                    [disabled]="registerForm.invalid || isLoading()"
                    (clicked)="onSubmit()">
                    {{ isLoading() ? 'Creando cuenta...' : 'Crear cuenta' }}
                </app-button>

            </form>
        </div>
    </div>
</div>
