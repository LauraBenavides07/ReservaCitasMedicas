<div class="dashboard-container">


    <!-- Estado de carga -->
    <div *ngIf="isLoading()" class="loading-state">
        <div class="spinner"></div>
    </div>

    <!-- Contenido principal -->
    <div *ngIf="!isLoading()" class="card card-container">

        <!-- Header con botón -->
        <div class="card-header">
            <h3 class="card-title">Mis citas</h3>

            <!-- Botón nueva cita -->
            <button class="btn btn-primary btn-sm" (click)="goToNuevaCita()">
                <svg width="14" height="14">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg> Nueva cita
            </button>
        </div>

        <!-- Estado vacío -->
        <div *ngIf="appointments().length === 0" class="empty-state">
            <p>No tienes citas agendadas actualmente.</p>
        </div>

        <!-- Tabla de citas -->
        <table *ngIf="appointments().length > 0" class="styled-table">
            <thead>
                <tr>
                    <th>FECHA</th>
                    <th>HORA</th>
                    <th>MÉDICO</th>
                    <th>ESTADO</th>
                    <th></th>
                </tr>
            </thead>

            <tbody>
                <!-- Iteración de citas -->
                <tr *ngFor="let app of appointments()" [class.cancelled]="app.status === 'cancelada'">
                    <!-- Mostrar Info o Inputs de Reagendar -->
                    <td *ngIf="reschedulingId() !== app.id"><strong>{{ formatDate(app.appointmentDate) }}</strong></td>
                    <td *ngIf="reschedulingId() !== app.id"><strong>{{ app.appointmentTime | slice:0:5 }}</strong></td>
                    
                    <td colspan="2" *ngIf="reschedulingId() === app.id">
                        <input type="date" [(ngModel)]="newDate" (change)="onDateChange(app.doctor?.id)" [min]="today" style="max-width: 130px; margin-right: 5px;">
                        <select [(ngModel)]="newTime" style="max-width: 100px;">
                            <option value="">Hora</option>
                            <option *ngFor="let slot of availableSlots()" [value]="slot">{{ slot }}</option>
                        </select>
                    </td>

                    <td>Dr(a). {{ app.doctor?.name }}</td>

                    <!-- Estado -->
                    <td>
                        <div class="apt-status" [ngClass]="getStatusClass(app.status)">
                            <span class="status-dot"></span>
                            {{ app.status | titlecase }}
                        </div>
                    </td>

                    <!-- Acciones -->
                    <td class="actions-cell">
                        <ng-container *ngIf="reschedulingId() !== app.id">
                            <button *ngIf="app.status === 'agendada'" class="btn btn-primary btn-sm" style="margin-right: 5px;"
                                (click)="startReschedule(app)">
                                Reagendar
                            </button>
                            <button *ngIf="app.status === 'agendada'" class="btn btn-cancel-red btn-sm"
                                (click)="cancel(app.id)">
                                Cancelar
                            </button>
                        </ng-container>

                        <ng-container *ngIf="reschedulingId() === app.id">
                            <button class="btn btn-primary btn-sm" style="margin-right: 5px;"
                                (click)="confirmReschedule(app.id)" [disabled]="!newDate || !newTime">
                                Confirmar
                            </button>
                            <button class="btn btn-cancel-red btn-sm"
                                (click)="reschedulingId.set(null)">
                                Atrás
                            </button>
                        </ng-container>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
