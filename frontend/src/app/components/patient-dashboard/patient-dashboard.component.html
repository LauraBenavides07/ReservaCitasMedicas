<div class="dashboard-container">

    <div *ngIf="isLoading()" class="loading-state">
        <div class="spinner"></div>
    </div>

    <div *ngIf="!isLoading()" class="card card-container">

        <div class="card-header">
            <h3 class="card-title">Mis citas</h3>
            <button class="btn btn-primary btn-patient-new" (click)="goToNuevaCita()">
                + Nueva cita
            </button>
        </div>

        <div *ngIf="appointments().length === 0" class="empty-state">
            <p>No tienes citas agendadas actualmente.</p>
        </div>

        <table *ngIf="appointments().length > 0" class="styled-table">
            <thead>
                <tr>
                    <th>FECHA</th>
                    <th>HORA</th>
                    <th>MÉDICO</th>
                    <th>ESTADO</th>
                    <th></th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let app of appointments()" [class.cancelled]="app.status === 'cancelada'">

                    <td data-label="FECHA">
                        <strong>{{ formatDate(app.appointmentDate) }}</strong>
                    </td>

                    <td data-label="HORA">
                        <strong>{{ formatTime(app.appointmentTime) }}</strong>
                    </td>

                    <td data-label="MÉDICO">Dr(a). {{ app.doctor?.name }}</td>

                    <td data-label="ESTADO">
                        <div class="apt-status" [ngClass]="getStatusClass(app.status)">
                            <span class="status-dot"></span>
                            {{ app.status | titlecase }}
                        </div>
                    </td>

                    <td class="actions-cell" data-label="ACCIONES">
                        <div class="actions-container">
                            <button *ngIf="app.status === 'agendada'" class="btn btn-cancel-red btn-sm"
                                (click)="cancel(app.id)">
                                Cancelar
                            </button>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
