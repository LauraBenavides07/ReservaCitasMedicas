<div class="dashboard-container">

    <!-- Encabezado -->
    <div class="header-area">
        <h2 class="page-title">Mis Citas</h2>
    </div>

    <!-- Estado de carga -->
    <div *ngIf="isLoading()" class="loading-state">
        <div class="spinner"></div>
    </div>

    <!-- Contenido principal -->
    <div *ngIf="!isLoading()" class="card card-container">

        <!-- Header con botón -->
        <div class="card-header">
            <h3 class="card-title">Mis citas</h3>

            <!-- Botón nueva cita -->
            <button class="btn btn-primary btn-sm" (click)="goToNuevaCita()">
                <svg width="14" height="14">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
                Nueva cita
            </button>
        </div>

        <!-- Estado vacío -->
        <div *ngIf="appointments().length === 0" class="empty-state">
            <p>No tienes citas agendadas actualmente.</p>
        </div>

        <!-- Tabla de citas -->
        <table *ngIf="appointments().length > 0" class="styled-table">
            <thead>
                <tr>
                    <th>FECHA</th>
                    <th>HORA</th>
                    <th>MÉDICO</th>
                    <th>ESTADO</th>
                    <th></th>
                </tr>
            </thead>

            <tbody>
                <!-- Iteración de citas -->
                <tr *ngFor="let app of appointments()" [class.cancelled]="app.status === 'cancelada'">

                    <td><strong>{{ formatDate(app.date) }}</strong></td>
                    <td><strong>{{ app.time }}</strong></td>

                    <td>Dr(a). {{ app.doctor?.name }}</td>

                    <!-- Estado -->
                    <td>
                        <span class="status-badge" [class]="getStatusClass(app.status)">
                            {{ app.status | titlecase }}
                        </span>
                    </td>

                    <!-- Acciones -->
                    <td class="actions-cell">

                        <!-- Solo si está agendada -->
                        <button *ngIf="app.status === 'agendada'" class="btn btn-cancel-red btn-sm"
                            (click)="cancel(app.id)">
                            Cancelar
                        </button>

                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
