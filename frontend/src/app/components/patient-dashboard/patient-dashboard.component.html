<div class="dashboard-container">

    <div *ngIf="isLoading()" class="loading-state" role="status">
        <div class="spinner"></div>
    </div>

    <app-card *ngIf="!isLoading()" padding="none" overflow="hidden">
        <div class="card-header">
            <h3 class="card-title">Mis citas</h3>
            <app-button variant="primary" (clicked)="goToNuevaCita()">
                + Nueva cita
            </app-button>
        </div>

        <div *ngIf="appointments().length === 0" class="empty-state">
            <p>No tienes citas agendadas actualmente.</p>
        </div>

        <table *ngIf="appointments().length > 0" class="piedrazul-table">
            <thead>
                <tr>
                    <th>FECHA</th>
                    <th>HORA</th>
                    <th>MÉDICO</th>
                    <th>ESTADO</th>
                    <th></th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let app of appointments(); trackBy: trackById" [class.cancelled]="app.status === 'cancelada'">

                    <td data-label="FECHA">
                        <strong>{{ formatDate(app.appointmentDate) }}</strong>
                    </td>

                    <td data-label="HORA">
                        <strong>{{ formatTime(app.appointmentTime) }}</strong>
                    </td>

                    <td data-label="MÉDICO">Dr(a). {{ app.doctor?.name }}</td>

                    <td data-label="ESTADO">
                        <app-badge
                            [status]="app.status"
                            variant="solid">
                        </app-badge>
                    </td>

                    <td class="actions-cell" data-label="ACCIONES">
                        <div class="actions-container">
                            <app-button *ngIf="app.status === 'agendada'" variant="danger" size="sm" (clicked)="cancel(app.id)">
                                Cancelar
                            </app-button>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </app-card>
</div>
