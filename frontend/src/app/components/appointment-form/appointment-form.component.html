<div class="appointment-form-wrapper">

    <!-- Banner de anticipación -->
    <app-alert
        type="info"
        [message]="'Las citas deben agendarse con <strong>mínimo ' + minAdvanceHours + ' horas de anticipación</strong> y <strong>máximo ' + maxAppointmentDays + ' días de anticipación</strong>.'"
        [show]="true">
    </app-alert>

    <!-- Mensajes de estado (arriba para visibilidad inmediata en móvil) -->
    <app-alert
        type="success"
        [message]="successMessage()"
        [show]="!!successMessage()">
    </app-alert>

    <app-alert
        type="error"
        [message]="errorMessage()"
        [show]="!!errorMessage()">
    </app-alert>

    <!-- Formulario principal -->
    <form [formGroup]="appointmentForm" (ngSubmit)="onSubmit()" class="two-column-layout">

        <!-- COLUMNA IZQUIERDA: DATOS DEL PACIENTE -->
        <div class="column-left">

            <app-card padding="md">
            <h3 class="card-title">1. Datos del Paciente</h3>

                <div class="form-grid">

                    <!-- Documento -->
                    <app-form-field 
                        class="full-width"
                        label="DOCUMENTO DE IDENTIDAD"
                        inputId="doc-input"
                        [required]="true"
                        [error]="f['patientDocument'].touched && f['patientDocument'].invalid ? 'El documento es necesario' : ''">
                        <div class="input-with-button">
                            <input type="text" id="doc-input" formControlName="patientDocument" placeholder="Ej: 12345678"
                                [class.input-error]="f['patientDocument'].touched && f['patientDocument'].errors">
                            <app-button variant="secondary" size="sm" (clicked)="searchPatient()">🔍 Buscar</app-button>
                        </div>
                    </app-form-field>

                    <!-- Nombre y apellido - Este es especial porque tiene dos inputs -->
                    <app-form-field 
                        class="full-width"
                        label="NOMBRES Y APELLIDOS"
                        [required]="true"
                        [error]="(f['firstName'].touched && f['firstName'].invalid) || (f['lastName'].touched && f['lastName'].invalid) ? 'Ambos nombres y apellidos son requeridos' : ''">
                        <div class="split-inputs">
                            <div>
                                <input type="text" formControlName="firstName" placeholder="Nombres"
                                    [class.input-error]="f['firstName'].touched && f['firstName'].invalid">
                            </div>
                            <div>
                                <input type="text" formControlName="lastName" placeholder="Apellidos"
                                    [class.input-error]="f['lastName'].touched && f['lastName'].invalid">
                            </div>
                        </div>
                    </app-form-field>

                    <!-- Celular y género (2 columnas) -->
                    <div class="form-row">
                        <app-form-field
                            label="CELULAR"
                            inputId="phone-input"
                            [required]="true"
                            [error]="f['phone'].touched && f['phone'].invalid ? 'El celular es obligatorio' : ''">
                            <input type="tel" id="phone-input" formControlName="phone" placeholder="300 000 0000"
                                [class.input-error]="f['phone'].touched && f['phone'].invalid">
                        </app-form-field>

                        <app-form-field
                            label="GÉNERO"
                            inputId="gender-input"
                            [required]="true"
                            [error]="f['gender'].touched && f['gender'].invalid ? 'Debe seleccionar un género' : ''">
                            <select id="gender-input" formControlName="gender"
                                [class.input-error]="f['gender'].touched && f['gender'].invalid">
                                <option value="">Seleccionar...</option>
                                <option value="M">Masculino</option>
                                <option value="F">Femenino</option>
                                <option value="O">Otro</option>
                            </select>
                        </app-form-field>
                    </div>

                    <!-- Correo -->
                    <app-form-field 
                        class="full-width"
                        label="CORREO ELECTRÓNICO"
                        inputId="email-input"
                        [required]="false"
                        [error]="f['email'].touched && f['email'].invalid ? 'Correo electrónico inválido' : ''">
                        <input type="email" id="email-input" formControlName="email" placeholder="paciente@ejemplo.com"
                            [class.input-error]="f['email'].touched && f['email'].invalid">
                    </app-form-field>

                </div>
            </app-card>
        </div>

        <!-- COLUMNA DERECHA: MÉDICO Y HORARIO -->
        <div class="column-right">

            <app-card padding="md">
                <h3 class="card-title">2. Selección de Especialista</h3>

                <!-- Campo oculto -->
                <input type="hidden" formControlName="doctorId">

                <!-- Lista de doctores -->
                <div class="doctors-grid">
                    <app-doctor-card
                        *ngFor="let doctor of doctors()"
                        [doctorId]="doctor.id"
                        [doctorName]="doctor.name"
                        [specialty]="doctor.specialty"
                        [selected]="f['doctorId'].value === doctor.id"
                        (selectDoctor)="selectDoctor(doctor.id)">
                    </app-doctor-card>
                </div>

                <!-- Sección de agendamiento -->
                <div class="selection-footer" *ngIf="f['doctorId'].value">

                    <h3 class="card-title mt-1.5rem">3. Fecha y Hora</h3>

                    <div class="form-row">
                        <app-form-field
                            label="DÍA DE CITA"
                            inputId="date-input"
                            [required]="true"
                            [error]="f['date'].touched && f['date'].invalid ? 'Debe seleccionar una fecha' : 
                                    (f['date'].value && isDateDisabled(f['date'].value) ? getDisabledDateReason(f['date'].value) : '')">
                            <input type="date" id="date-input" formControlName="date" (change)="onDateChange()" [min]="today"
                                [class.input-error]="f['date'].touched && f['date'].invalid">
                        </app-form-field>

                        <app-form-field
                            label="HORARIO"
                            inputId="time-input"
                            [required]="true"
                            [error]="f['time'].touched && f['time'].invalid ? 'Debe seleccionar una hora' : ''">
                            <select id="time-input" formControlName="time"
                                [class.input-error]="f['time'].touched && f['time'].invalid">
                                <option value="">Ver turnos...</option>
                                <option *ngFor="let slot of availableSlots()" [value]="slot">
                                    {{ formatSlot(slot) }}
                                </option>
                            </select>
                        </app-form-field>
                    </div>

                </div>

                <!-- Botón de envío -->
                <div class="form-actions mt-1.5rem">
                    <app-button type="submit" variant="primary" [fullWidth]="true" [disabled]="appointmentForm.invalid || isSubmitting()">
                         {{ isSubmitting() ? 'Procesando...' : 'Confirmar Cita Médica' }}
                    </app-button>
                </div>

            </app-card>
        </div>

    </form>
</div>
