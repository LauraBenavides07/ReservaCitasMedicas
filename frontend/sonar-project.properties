# Identificación del proyecto
sonar.projectKey=Reserva-citas-frontend
sonar.projectName=Reserva Citas Medicas Frontend
sonar.projectVersion=1.0

# Ruta del código
sonar.sources=src

# Lenguaje
sonar.language=ts

# Excluir cosas innecesarias
sonar.exclusions=**/node_modules/**, **/coverage/**, src/environments/**

# Coverage (IMPORTANTE para subir cobertura)
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info

# Encoding
sonar.sourceEncoding=UTF-8

# URL del servidor
sonar.host.url=http://localhost:9000
