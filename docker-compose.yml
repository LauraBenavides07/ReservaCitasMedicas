version: '3.8'

services:
  # ─── Base de Datos ───────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: piedrazul-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: piedrazul
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  # ─── Message Broker ──────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: piedrazul-rabbitmq
    ports:
      - '5672:5672'   # Conexiones AMQP (aplicaciones)
      - '15672:15672' # Consola web de administración
    environment:
      RABBITMQ_DEFAULT_USER: piedrazul
      RABBITMQ_DEFAULT_PASS: piedrazul_pass
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped

volumes:
  postgres_data:
  rabbitmq_data:
